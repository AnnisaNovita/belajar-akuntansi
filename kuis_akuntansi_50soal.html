<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Akuntansi 50 Soal</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;font-family:Georgia,serif;color:#e6edf3;min-height:100vh}
.screen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.screen.active{display:flex}
/* HOME */
.home-card{background:#161b22;border:1px solid #30363d;border-radius:20px;padding:48px 40px;max-width:480px;width:100%;text-align:center}
.home-title{font-size:36px;font-weight:900;color:#f0f6fc;margin-bottom:8px}
.home-sub{color:#8b949e;font-size:14px;margin-bottom:32px}
.sesi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.sesi-btn{background:#21262d;border:1.5px solid #30363d;border-radius:12px;padding:20px 16px;cursor:pointer;transition:.2s;color:#e6edf3;font-family:inherit}
.sesi-btn:hover{border-color:#58a6ff;background:#1f2937}
.sesi-btn .sesi-num{font-size:28px;font-weight:900;color:#58a6ff;display:block;margin-bottom:4px}
.sesi-btn .sesi-label{font-size:12px;color:#8b949e}
.start-all{background:#58a6ff;color:#000;border:none;border-radius:12px;padding:14px 32px;font-weight:700;font-size:15px;cursor:pointer;width:100%;font-family:inherit}
/* QUIZ */
.quiz-wrap{max-width:640px;width:100%}
.quiz-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.quiz-label{color:#8b949e;font-size:12px;font-family:monospace}
.quiz-counter{color:#e6edf3;font-size:13px;font-weight:700}
.progress-bar{height:4px;background:#21262d;border-radius:99px;margin-bottom:20px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#f78166);border-radius:99px;transition:width .3s}
.q-card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:24px}
.q-kat{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
.q-text{color:#e6edf3;font-size:15px;line-height:1.7;margin-bottom:20px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice-btn{background:#0d1117;border:1.5px solid #30363d;border-radius:10px;padding:12px 14px;color:#8b949e;font-size:13.5px;text-align:left;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:.15s;font-family:inherit;line-height:1.5}
.choice-btn:hover:not(.locked){border-color:#58a6ff;color:#e6edf3}
.choice-btn .badge{min-width:24px;height:24px;border-radius:6px;background:#21262d;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;margin-top:1px}
.choice-btn.correct{background:#3fb95015;border-color:#3fb950;color:#3fb950}
.choice-btn.correct .badge{background:#3fb95033}
.choice-btn.wrong{background:#f8514915;border-color:#f85149;color:#f85149}
.choice-btn.wrong .badge{background:#f8514933}
.choice-btn.locked{cursor:default}
.feedback{margin-top:16px;background:#0d1117;border-radius:10px;padding:12px 14px}
.feedback-title{font-weight:700;font-size:12px;margin-bottom:4px}
.feedback-title.ok{color:#3fb950}
.feedback-title.no{color:#f85149}
.feedback-body{color:#8b949e;font-size:13px;line-height:1.6}
.next-btn{margin-top:12px;width:100%;background:#58a6ff;color:#000;border:none;border-radius:12px;padding:15px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.live-score{text-align:center;margin-top:12px;color:#8b949e;font-size:12px}
.live-score span{color:#58a6ff;font-weight:700}
/* RESULT */
.result-card{background:#161b22;border:1px solid #30363d;border-radius:20px;padding:40px 32px;max-width:500px;width:100%;text-align:center}
.result-emoji{font-size:56px;margin-bottom:6px}
.result-grade{font-size:72px;font-weight:900;line-height:1;font-family:Georgia,serif}
.result-msg{color:#8b949e;font-size:14px;margin-top:4px;margin-bottom:24px}
.result-score-box{background:#0d1117;border-radius:14px;padding:20px;margin-bottom:20px}
.result-big{font-size:48px;font-weight:700;color:#e6edf3}
.result-big span{font-size:24px;color:#8b949e}
.result-pct{font-size:28px;font-weight:700;margin-top:6px}
.kat-breakdown{text-align:left;margin-bottom:20px}
.kat-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.kat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.kat-name{flex:1;font-size:13px;color:#8b949e}
.kat-score{font-size:13px;font-weight:700;color:#e6edf3}
.kat-bar-bg{width:60px;height:6px;background:#21262d;border-radius:99px;overflow:hidden}
.kat-bar-fill{height:100%;border-radius:99px}
.dots-row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:24px}
.dot-r{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.dot-r.ok{background:#3fb95033;border:1.5px solid #3fb950;color:#3fb950}
.dot-r.no{background:#f8514933;border:1.5px solid #f85149;color:#f85149}
.result-btns{display:flex;gap:10px}
.btn-outline{flex:1;background:#21262d;color:#e6edf3;border:none;border-radius:10px;padding:13px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn-primary{flex:1;background:#58a6ff;color:#000;border:none;border-radius:10px;padding:13px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="home-card">
    <div class="home-title">Kuis Akuntansi</div>
    <div class="home-sub">50 soal pilihan ganda · Pengantar & Menengah</div>
    <div class="sesi-grid">
      <button class="sesi-btn" onclick="startSesi(1)">
        <span class="sesi-num">S1</span>
        <span class="sesi-label">25 Soal Pertama</span>
      </button>
      <button class="sesi-btn" onclick="startSesi(2)">
        <span class="sesi-num">S2</span>
        <span class="sesi-label">25 Soal Kedua</span>
      </button>
    </div>
    <button class="start-all" onclick="startSesi(0)">Mulai Semua 50 Soal →</button>
  </div>
</div>

<!-- QUIZ -->
<div class="screen" id="screen-quiz">
  <div class="quiz-wrap">
    <div class="quiz-topbar">
      <div class="quiz-label" id="quiz-label">SESI 1</div>
      <div class="quiz-counter" id="quiz-counter">1/25</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="q-card">
      <div class="q-kat" id="q-kat"></div>
      <div class="q-text" id="q-text"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback" style="display:none">
        <div class="feedback-title" id="feedback-title"></div>
        <div class="feedback-body" id="feedback-body"></div>
      </div>
    </div>
    <button class="next-btn" id="next-btn" style="display:none" onclick="nextQ()">Lanjut →</button>
    <div class="live-score">Skor: <span id="live-score">0</span> benar</div>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="screen-result">
  <div class="result-card">
    <div class="result-emoji" id="res-emoji">🏆</div>
    <div class="result-grade" id="res-grade">A</div>
    <div class="result-msg" id="res-msg"></div>
    <div class="result-score-box">
      <div class="result-big" id="res-big"></div>
      <div class="result-pct" id="res-pct"></div>
    </div>
    <div class="kat-breakdown" id="kat-breakdown"></div>
    <div class="dots-row" id="dots-row"></div>
    <div class="result-btns">
      <button class="btn-outline" onclick="goHome()">← Menu</button>
      <button class="btn-primary" id="btn-next-sesi" style="display:none" onclick="nextSesi()">Sesi 2 →</button>
      <button class="btn-outline" id="btn-retry" onclick="retry()">Ulangi</button>
    </div>
  </div>
</div>

<script>
const KAT_COLOR = {
  "Pengantar Akuntansi":"#58a6ff",
  "Perusahaan Dagang":"#d29922",
  "Jurnal Penyesuaian":"#bc8cff",
  "Buku Besar":"#3fb950",
  "Laporan Keuangan":"#f78166"
};

const ALL_Q = [
  // ── SESI 1 ──────────────────────────────────────────────────────────────
  {k:"Pengantar Akuntansi",s:"Akuntansi didefinisikan sebagai proses…",
   p:["Mencatat, mengklasifikasikan, dan melaporkan transaksi keuangan","Mengelola uang perusahaan agar tidak rugi","Membuat anggaran dan rencana keuangan","Menghitung pajak yang harus dibayar"],
   j:0,b:"Akuntansi adalah proses mengidentifikasi, mencatat, mengklasifikasikan, meringkas, dan melaporkan transaksi keuangan untuk pengambilan keputusan."},

  {k:"Pengantar Akuntansi",s:"Konsep 'Going Concern' dalam akuntansi berarti…",
   p:["Perusahaan akan terus beroperasi dalam jangka panjang","Semua transaksi harus dicatat tepat waktu","Laporan keuangan harus dibuat setiap bulan","Aset harus dinilai berdasarkan harga pasar"],
   j:0,b:"Going Concern berasumsi perusahaan akan terus beroperasi jangka panjang dan tidak akan dilikuidasi dalam waktu dekat."},

  {k:"Pengantar Akuntansi",s:"Manakah yang merupakan akun ASET TETAP?",
   p:["Perlengkapan Toko","Persediaan Barang","Kendaraan","Piutang Usaha"],
   j:2,b:"Kendaraan adalah aset tetap karena digunakan lebih dari satu periode. Perlengkapan, Persediaan, dan Piutang adalah aset lancar."},

  {k:"Pengantar Akuntansi",s:"Jika Aset = Rp200jt dan Liabilitas = Rp75jt, maka Ekuitas adalah…",
   p:["Rp275.000.000","Rp125.000.000","Rp75.000.000","Rp200.000.000"],
   j:1,b:"Ekuitas = Aset − Liabilitas = Rp200jt − Rp75jt = Rp125jt."},

  {k:"Pengantar Akuntansi",s:"Prinsip yang menyatakan pendapatan diakui saat diperoleh (bukan saat kas diterima) disebut…",
   p:["Cash Basis","Accrual Basis","Cost Principle","Matching Principle"],
   j:1,b:"Accrual Basis mengakui pendapatan saat diperoleh dan beban saat terjadi, tanpa memandang kapan kas diterima/dibayar."},

  {k:"Pengantar Akuntansi",s:"Akun 'Akumulasi Penyusutan' termasuk jenis akun…",
   p:["Aset Tetap","Beban","Contra Asset (pengurang aset)","Liabilitas"],
   j:2,b:"Akumulasi Penyusutan adalah contra-asset — mengurangi nilai aset tetap. Saldo normalnya Kredit, berlawanan dengan aset tetap."},

  {k:"Pengantar Akuntansi",s:"Membeli perlengkapan kantor Rp800.000 secara kredit. Jurnal yang benar adalah…",
   p:["D: Kas 800rb | K: Perlengkapan 800rb","D: Beban Perlengkapan 800rb | K: Utang 800rb","D: Perlengkapan 800rb | K: Utang Usaha 800rb","D: Perlengkapan 800rb | K: Kas 800rb"],
   j:2,b:"Beli perlengkapan kredit → Perlengkapan bertambah (D), Utang Usaha bertambah (K). Belum keluar kas."},

  {k:"Pengantar Akuntansi",s:"Apa yang dimaksud dengan Neraca Saldo (Trial Balance)?",
   p:["Laporan posisi keuangan (aset, utang, modal)","Daftar semua akun beserta saldonya untuk cek keseimbangan D=K","Laporan laba rugi ringkas","Rekap semua transaksi selama satu periode"],
   j:1,b:"Neraca Saldo adalah daftar semua akun buku besar beserta saldonya untuk memverifikasi total Debet = total Kredit."},

  {k:"Perusahaan Dagang",s:"Beban Angkut Pembelian dengan syarat FOB Shipping Point ditanggung oleh…",
   p:["Penjual","Pembeli","Ekspedisi","Dibagi dua"],
   j:1,b:"FOB Shipping Point = ongkos angkut ditanggung PEMBELI sejak barang meninggalkan gudang penjual."},

  {k:"Perusahaan Dagang",s:"Syarat '3/7, n/30' artinya…",
   p:["Diskon 7% jika bayar dalam 3 hari, jatuh tempo 30 hari","Diskon 3% jika bayar dalam 7 hari, jatuh tempo 30 hari","Diskon 3% jika bayar dalam 30 hari, jatuh tempo 7 hari","Denda 3% jika bayar lewat 7 hari"],
   j:1,b:"3/7 = diskon 3% jika bayar dalam 7 hari. n/30 = jatuh tempo 30 hari tanpa diskon."},

  {k:"Perusahaan Dagang",s:"Penjualan bersih dihitung dengan rumus…",
   p:["Penjualan + Retur + Diskon","Penjualan − Retur Penjualan − Diskon Penjualan","Penjualan − HPP","Penjualan − Beban Operasional"],
   j:1,b:"Penjualan Bersih = Penjualan − Retur Penjualan − Diskon Penjualan."},

  {k:"Perusahaan Dagang",s:"Membeli barang Rp50jt + PPN 11% secara kredit. Berapa Utang Usaha yang dicatat?",
   p:["Rp50.000.000","Rp55.000.000","Rp55.500.000","Rp50.550.000"],
   j:2,b:"PPN = 11% × 50jt = 5,5jt. Total utang = 50jt + 5,5jt = Rp55.500.000."},

  {k:"Perusahaan Dagang",s:"Laba Kotor perusahaan dagang dihitung dari…",
   p:["Penjualan Bersih − Semua Beban","Penjualan Bersih − HPP","Penjualan − Beban Operasional","Pendapatan − Pajak"],
   j:1,b:"Laba Kotor = Penjualan Bersih − HPP. Setelah itu dikurangi beban operasional untuk dapat Laba Bersih."},

  {k:"Perusahaan Dagang",s:"Diskon penjualan dalam laporan laba rugi posisinya…",
   p:["Ditambahkan ke penjualan","Dikurangkan dari penjualan","Masuk ke beban operasional","Masuk ke HPP"],
   j:1,b:"Diskon Penjualan mengurangi pendapatan: Penjualan − Retur − Diskon = Penjualan Bersih."},

  {k:"Jurnal Penyesuaian",s:"Perlengkapan awal Rp5jt, dibeli lagi Rp2jt, sisa akhir Rp3,5jt. Beban perlengkapan adalah…",
   p:["Rp2.000.000","Rp3.500.000","Rp3.000.000","Rp5.000.000"],
   j:1,b:"Beban = (5jt + 2jt) − 3,5jt = Rp3.500.000. Ini yang terpakai selama periode."},

  {k:"Jurnal Penyesuaian",s:"Kendaraan Rp120jt, residu Rp20jt, umur 8 tahun. Penyusutan per bulan adalah…",
   p:["Rp833.333","Rp1.041.667","Rp1.250.000","Rp1.000.000"],
   j:1,b:"(120jt − 20jt) ÷ 8 tahun ÷ 12 bulan = 100jt ÷ 96 = Rp1.041.667 per bulan."},

  {k:"Jurnal Penyesuaian",s:"Pendapatan diterima di muka Rp6jt untuk 3 bulan. Setelah 1 bulan, jurnal penyesuaiannya…",
   p:["D: Pendapatan Diterima Dimuka 2jt | K: Pendapatan 2jt","D: Pendapatan 2jt | K: Kas 2jt","D: Kas 2jt | K: Pendapatan 2jt","D: Pendapatan Diterima Dimuka 6jt | K: Pendapatan 6jt"],
   j:0,b:"6jt ÷ 3 bulan = 2jt per bulan. D: Pendapatan Diterima Dimuka 2jt | K: Pendapatan 2jt."},

  {k:"Jurnal Penyesuaian",s:"Nilai buku aset tetap dihitung dengan…",
   p:["Harga Perolehan + Akumulasi Penyusutan","Harga Perolehan − Akumulasi Penyusutan","Harga Pasar − Beban Penyusutan","Harga Perolehan × Tarif Penyusutan"],
   j:1,b:"Nilai Buku = Harga Perolehan − Akumulasi Penyusutan. Makin lama dipakai, nilai buku makin kecil."},

  {k:"Jurnal Penyesuaian",s:"Jurnal penyesuaian untuk sewa dibayar di muka yang sudah jatuh tempo adalah…",
   p:["D: Sewa Dibayar Dimuka | K: Kas","D: Beban Sewa | K: Sewa Dibayar Dimuka","D: Beban Sewa | K: Kas","D: Sewa Dibayar Dimuka | K: Beban Sewa"],
   j:1,b:"Bagian yang sudah jatuh tempo jadi beban: D: Beban Sewa | K: Sewa Dibayar Dimuka."},

  {k:"Buku Besar",s:"Fungsi utama buku besar (ledger) adalah…",
   p:["Mencatat transaksi secara kronologis","Mengelompokkan transaksi per akun","Membuat laporan keuangan","Menghitung pajak perusahaan"],
   j:1,b:"Buku Besar mengelompokkan transaksi per akun. Jurnal = kronologis, Buku Besar = per akun."},

  {k:"Buku Besar",s:"Saldo Kas: awal Rp50jt, total debet Rp30jt, total kredit Rp45jt. Saldo akhir kas adalah…",
   p:["Rp35.000.000","Rp65.000.000","Rp25.000.000","Rp45.000.000"],
   j:0,b:"Kas saldo normal Debet. Saldo akhir = 50jt + 30jt − 45jt = Rp35.000.000."},

  {k:"Buku Besar",s:"Proses memindahkan data dari jurnal ke buku besar disebut…",
   p:["Journalizing","Posting","Balancing","Closing"],
   j:1,b:"Posting = proses memindahkan catatan jurnal ke akun-akun di buku besar."},

  {k:"Laporan Keuangan",s:"Modal akhir dihitung dengan…",
   p:["Modal Awal + Laba + Prive","Modal Awal + Setoran Modal + Laba Bersih − Prive","Modal Awal − Laba − Prive","Modal Awal + Pendapatan − Beban"],
   j:1,b:"Modal Akhir = Modal Awal + Setoran Modal + Laba Bersih − Prive."},

  {k:"Laporan Keuangan",s:"Dalam neraca, aset disajikan berdasarkan urutan…",
   p:["Nilai terbesar ke terkecil","Abjad nama akun","Tingkat likuiditas (paling mudah dicairkan lebih dulu)","Tanggal perolehan"],
   j:2,b:"Aset disusun dari paling likuid: Kas → Piutang → Persediaan → Peralatan → dst."},

  {k:"Laporan Keuangan",s:"Prive dalam laporan keuangan berpengaruh pada…",
   p:["Mengurangi pendapatan di L/R","Menambah beban di L/R","Mengurangi modal di Laporan Perubahan Modal","Menambah utang di Neraca"],
   j:2,b:"Prive bukan beban perusahaan. Prive langsung mengurangi modal di Laporan Perubahan Modal."},

  // ── SESI 2 ──────────────────────────────────────────────────────────────
  {k:"Pengantar Akuntansi",s:"Manakah yang BUKAN karakteristik informasi akuntansi yang berkualitas?",
   p:["Relevan","Dapat diandalkan (Reliable)","Menguntungkan pemilik","Dapat dibandingkan (Comparable)"],
   j:2,b:"Karakteristik kualitatif: Relevan, Reliable, Comparable, Konsisten. 'Menguntungkan pemilik' bukan — akuntansi harus netral dan objektif."},

  {k:"Pengantar Akuntansi",s:"Transaksi 'Pemilik menyetor modal tunai Rp50jt' dicatat sebagai…",
   p:["D: Modal 50jt | K: Kas 50jt","D: Kas 50jt | K: Modal 50jt","D: Kas 50jt | K: Utang 50jt","D: Modal 50jt | K: Utang 50jt"],
   j:1,b:"Pemilik setor modal → Kas perusahaan bertambah (D: Kas), Modal bertambah (K: Modal)."},

  {k:"Pengantar Akuntansi",s:"Perbedaan utama perusahaan jasa, dagang, dan manufaktur adalah…",
   p:["Besarnya modal yang digunakan","Ada tidaknya persediaan dan proses produksi","Jumlah karyawan yang dimiliki","Cara membayar pajak"],
   j:1,b:"Jasa: tidak ada persediaan. Dagang: beli & jual barang jadi. Manufaktur: ubah bahan baku jadi barang jadi."},

  {k:"Pengantar Akuntansi",s:"Manakah pernyataan yang BENAR tentang akun Prive?",
   p:["Prive adalah beban perusahaan yang mengurangi laba","Prive adalah pengambilan pribadi pemilik yang mengurangi modal","Prive masuk ke laporan laba rugi sebagai beban","Prive menambah modal pemilik"],
   j:1,b:"Prive = pengambilan pribadi pemilik. BUKAN beban, tidak masuk L/R, tapi mengurangi modal."},

  {k:"Pengantar Akuntansi",s:"Jurnal penutup dibuat untuk…",
   p:["Memperbaiki kesalahan jurnal sebelumnya","Menutup akun nominal agar saldonya nol di awal periode baru","Menutup akun riil di akhir tahun","Membuat neraca saldo awal"],
   j:1,b:"Jurnal penutup menutup akun nominal (pendapatan, beban, prive) agar saldonya nol untuk periode berikutnya."},

  {k:"Perusahaan Dagang",s:"CV Maju membeli barang Rp20jt syarat 2/10, n/30. Membayar hari ke-8. Berapa kas yang dikeluarkan?",
   p:["Rp19.600.000","Rp20.000.000","Rp19.200.000","Rp20.400.000"],
   j:0,b:"Bayar dalam 10 hari → dapat diskon 2%. Diskon = 2% × 20jt = 400rb. Kas = 20jt − 400rb = Rp19.600.000."},

  {k:"Perusahaan Dagang",s:"PPN Masukan adalah…",
   p:["PPN yang dipungut saat kita menjual barang","PPN yang kita bayar saat membeli barang dari supplier","PPN yang disetor ke kas negara","PPN atas jasa yang diterima"],
   j:1,b:"PPN Masukan = pajak yang dibayar saat MEMBELI. PPN Keluaran = dipungut saat MENJUAL. Setor ke negara = Keluaran − Masukan."},

  {k:"Perusahaan Dagang",s:"Persediaan awal Rp80jt, pembelian bersih Rp120jt, persediaan akhir Rp50jt. HPP adalah…",
   p:["Rp150.000.000","Rp170.000.000","Rp200.000.000","Rp130.000.000"],
   j:0,b:"HPP = Persediaan Awal + Pembelian Bersih − Persediaan Akhir = 80 + 120 − 50 = Rp150jt."},

  {k:"Perusahaan Dagang",s:"Manakah yang MENAMBAH nilai pembelian bersih?",
   p:["Diskon Pembelian","Retur Pembelian","Beban Angkut Pembelian","Potongan Harga"],
   j:2,b:"Pembelian Bersih = Pembelian + Beban Angkut − Retur − Diskon. Hanya Beban Angkut yang menambah."},

  {k:"Perusahaan Dagang",s:"Menjual barang Rp40jt + PPN 11% kredit. Total piutang yang dicatat adalah…",
   p:["Rp40.000.000","Rp44.000.000","Rp44.400.000","Rp65.000.000"],

// State
let activeQ = [];
let idx = 0, skor = 0, hasil = [], activeSesi = 0;

function getKatColor(k){ return KAT_COLOR[k] || "#58a6ff"; }

function goHome(){
  showScreen("screen-home");
  idx=0; skor=0; hasil=[]; activeQ=[];
}

function startSesi(s){
  activeSesi = s;
  if(s===0) activeQ = [...ALL_Q];
  else if(s===1) activeQ = ALL_Q.slice(0,25);
  else activeQ = ALL_Q.slice(25,50);
  idx=0; skor=0; hasil=[];
  showScreen("screen-quiz");
  renderQ();
}

function nextSesi(){
  startSesi(2);
}

function retry(){
  idx=0; skor=0; hasil=[];
  showScreen("screen-quiz");
  renderQ();
}

function renderQ(){
  const q = activeQ[idx];
  const total = activeQ.length;
  const label = activeSesi===0 ? "SEMUA 50 SOAL" : activeSesi===1 ? "SESI 1 · 25 SOAL" : "SESI 2 · 25 SOAL";
  document.getElementById("quiz-label").textContent = label;
  document.getElementById("quiz-counter").textContent = (idx+1)+"/"+total;
  document.getElementById("progress-fill").style.width = (idx/total*100)+"%";

  const kat = document.getElementById("q-kat");
  kat.textContent = q.k;
  kat.style.background = getKatColor(q.k)+"22";
  kat.style.color = getKatColor(q.k);

  document.getElementById("q-text").textContent = q.s;
  document.getElementById("feedback").style.display="none";
  document.getElementById("next-btn").style.display="none";
  document.getElementById("live-score").parentElement.querySelector("span").textContent = skor;

  const cc = document.getElementById("choices");
  cc.innerHTML="";
  q.p.forEach((p,i)=>{
    const btn = document.createElement("button");
    btn.className="choice-btn";
    btn.innerHTML=`<span class="badge">${String.fromCharCode(65+i)}</span>${p}`;
    btn.onclick=()=>answer(i);
    cc.appendChild(btn);
  });
}

function answer(i){
  const q = activeQ[idx];
  const btns = document.querySelectorAll(".choice-btn");
  btns.forEach(b=>b.classList.add("locked"));
  const benar = i===q.j;
  if(benar) skor++;
  hasil.push({benar, kat:q.k});
  btns[q.j].classList.add("correct");
  btns[q.j].querySelector(".badge").textContent="✓";
  if(!benar){
    btns[i].classList.add("wrong");
    btns[i].querySelector(".badge").textContent="✗";
  }
  const fb = document.getElementById("feedback");
  const fbt = document.getElementById("feedback-title");
  const fbb = document.getElementById("feedback-body");
  fb.style.display="block";
  fb.style.borderLeft = "3px solid "+(benar?"#3fb950":"#f85149");
  fbt.className="feedback-title "+(benar?"ok":"no");
  fbt.textContent = benar ? "✓ Benar!" : "✗ Jawaban benar: "+String.fromCharCode(65+q.j);
  fbb.textContent = q.b;
  document.getElementById("next-btn").style.display="block";
  document.getElementById("next-btn").textContent = idx+1>=activeQ.length ? "Lihat Hasil →" : "Lanjut →";
  document.getElementById("live-score").parentElement.querySelector("span").textContent = skor;
}

function nextQ(){
  if(idx+1>=activeQ.length){ showResult(); return; }
  idx++;
  renderQ();
}

function showResult(){
  showScreen("screen-result");
  const total = activeQ.length;
  const pct = Math.round(skor/total*100);
  const grade = pct>=80?"A":pct>=65?"B":pct>=50?"C":"D";
  const gcolor = pct>=80?"#3fb950":pct>=65?"#d29922":"#f85149";
  const emoji = pct>=80?"🏆":pct>=65?"🌟":pct>=50?"📖":"💡";
  const msg = pct>=80?"Luar biasa! 🎉":pct>=65?"Bagus! Terus latihan 💪":pct>=50?"Lumayan, review materi ya 📚":"Yuk pelajari lagi! 😊";

  document.getElementById("res-emoji").textContent=emoji;
  const gEl = document.getElementById("res-grade");
  gEl.textContent=grade; gEl.style.color=gcolor;
  document.getElementById("res-msg").textContent=msg;
  document.getElementById("res-big").innerHTML=skor+'<span>/'+total+'</span>';
  const pEl=document.getElementById("res-pct");
  pEl.textContent=pct+"%"; pEl.style.color=gcolor;

  // Per kategori
  const katMap={};
  hasil.forEach(h=>{
    if(!katMap[h.kat]) katMap[h.kat]={b:0,t:0};
    katMap[h.kat].t++;
    if(h.benar) katMap[h.kat].b++;
  });
  const kd=document.getElementById("kat-breakdown");
  kd.innerHTML="";
  Object.entries(katMap).forEach(([k,v])=>{
    const pctk=Math.round(v.b/v.t*100);
    kd.innerHTML+=`<div class="kat-row">
      <div class="kat-dot" style="background:${getKatColor(k)}"></div>
      <div class="kat-name">${k}</div>
      <div class="kat-score">${v.b}/${v.t}</div>
      <div class="kat-bar-bg"><div class="kat-bar-fill" style="width:${pctk}%;background:${getKatColor(k)}"></div></div>
    </div>`;
  });

  // Dots
  const dr=document.getElementById("dots-row");
  dr.innerHTML="";
  hasil.forEach((h,i)=>{
    dr.innerHTML+=`<div class="dot-r ${h.benar?"ok":"no"}">${h.benar?"✓":"✗"}</div>`;
  });

  // Buttons
  document.getElementById("btn-next-sesi").style.display = (activeSesi===1) ? "block" : "none";
  document.getElementById("btn-retry").style.display = "block";
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
</script>
